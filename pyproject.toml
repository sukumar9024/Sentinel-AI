[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.2.0"
description = "Deterministic security detection and incident investigation lab"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2", "alembic>=1.16,<2", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "pydantic-settings>=2.7,<3", "pyjwt>=2.10,<3", "pyyaml>=6,<7", "prometheus-client>=0.21,<1", "redis>=5,<8", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
