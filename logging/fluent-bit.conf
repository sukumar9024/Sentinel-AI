[SERVICE]
    Flush 1
    Log_Level warn
    Parsers_File /fluent-bit/etc/parsers-sentinel.conf
    storage.path /logs/buffer
    storage.sync normal
    storage.checksum on
    storage.backlog.mem_limit 10M

[INPUT]
    Name tail
    Path /logs/application.jsonl
    Parser sentinel_json
    Tag sentinel.application
    DB /logs/tail-state.db
    Read_from_Head true
    Buffer_Chunk_Size 16k
    Buffer_Max_Size 16k
    Skip_Long_Lines on
    storage.type filesystem
    Refresh_Interval 1

[OUTPUT]
    Name http
    Match sentinel.*
    Host api
    Port 8000
    URI /api/v1/collectors/fluent-bit
    Format json
    Json_date_key collector_time
    Json_date_format iso8601
    Header X-API-Key ${COLLECTOR_KEY}
    Retry_Limit False
    storage.total_limit_size 100M
