# Linux host collection example. Mount only the specific log paths read-only.
# Each input must add host, environment, service and source_type through a modify filter.
[INPUT]
    Name tail
    Path /var/log/auth.log
    Tag host.auth
    DB /logs/auth-state.db
    Key message
    storage.type filesystem
[FILTER]
    Name modify
    Match host.auth
    Add environment local
    Add host monitored-host
    Add service sshd
    Add source_type auth
# Use HTTP Json_date_key timestamp for this raw text stream.
# Docker JSON-file collection: parse its JSON wrapper with Parser sentinel_json;
# retain its `log` field and `time` timestamp, then use the adapter to unwrap it.
# Never mount the Docker daemon socket just to collect logs.
