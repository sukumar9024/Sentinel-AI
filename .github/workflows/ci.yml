name: SentinelAI checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check backend tests scripts
      - run: pytest -q
      - run: pip install pip-audit && pip-audit -r requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/bootstrap.py
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python scripts/compose_smoke.py
      - run: docker compose logs --tail=50
        if: failure()
      - run: docker compose down
        if: always()
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: sentinel-ai-api:latest
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make setup
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots/
            frontend/test-results/
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.1'
      - run: terraform fmt -check -recursive && terraform init -backend=false && terraform validate
        working-directory: infrastructure/terraform
  static-security:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.139.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config=.semgrep.yml --metrics=off --error backend scripts
