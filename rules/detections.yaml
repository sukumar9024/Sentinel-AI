# Detection-as-code. JSON is a YAML subset. Validate with pytest.
[
  {
    "id": "AUTH-001",
    "name": "Failed login burst",
    "severity": "high",
    "match": {
      "event_type": {
        "eq": "authentication_failure"
      }
    },
    "count": 10,
    "within_seconds": 60,
    "suppression_seconds": 300,
    "mitre": {
      "id": "T1110",
      "name": "Brute Force",
      "tactic": "Credential Access"
    },
    "preceded_by": null
  },
  {
    "id": "AUTH-002",
    "name": "Successful login after repeated failures",
    "severity": "critical",
    "match": {
      "event_type": {
        "eq": "authentication_success"
      }
    },
    "count": 1,
    "within_seconds": 300,
    "suppression_seconds": 300,
    "mitre": {
      "id": "T1078",
      "name": "Valid Accounts",
      "tactic": "Initial Access"
    },
    "preceded_by": {
      "match": {
        "event_type": {
          "eq": "authentication_failure"
        }
      },
      "count": 5,
      "same_username": true
    }
  },
  {
